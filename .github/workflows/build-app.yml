name: Build macOS app

on:
  push:
    paths:
      - 'Sources/**'
      - 'Tools/build-homekit.sh'
      - 'elgato_homekit_bridge.py'
      - 'elgato_camera_control_advanced.py'
      - 'requirements*.txt'
      - 'tests/**'
      - 'Package.swift'
      - 'Info.plist'
      - 'Makefile'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homekit:
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            python-architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
            python-architecture: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python-architecture }}
      - name: Build standalone HomeKit helper
        env:
          TARGET_ARCH: ${{ matrix.architecture }}
        run: bash Tools/build-homekit.sh
      - name: Test bridge and standalone runtime
        run: |
          .build/homekit-venv/bin/python -m unittest discover -s tests -v
          env PATH=/usr/bin:/bin .build/homekit-dist/ElgatoHomeKitBridge --help
          mv .build/homekit-dist/ElgatoHomeKitBridge .build/homekit-dist/ElgatoHomeKitBridge-${{ matrix.architecture }}
      - uses: actions/upload-artifact@v4
        with:
          name: homekit-helper-${{ matrix.architecture }}
          path: .build/homekit-dist/ElgatoHomeKitBridge-*

  build:
    needs: homekit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: homekit-helper-*
          path: .build/homekit-dist
          merge-multiple: true

      - name: Build universal binary (arm64 + x86_64)
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Test optional HomeKit lifecycle
        run: |
          swiftc -parse-as-library Sources/HomeKitBridge.swift tests/HomeKitBridgeLifecycle.swift -o .build/homekit-lifecycle-tests
          .build/homekit-lifecycle-tests

      - name: Assemble .app bundle
        run: |
          chmod +x .build/homekit-dist/ElgatoHomeKitBridge-*
          make bundle BUILD_DIR=.build/apple/Products/Release
          codesign --verify --deep --strict build/ElgatoCameraControl.app

      - name: Zip app
        run: ditto -c -k --keepParent build/ElgatoCameraControl.app ElgatoCameraControl.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElgatoCameraControl
          path: ElgatoCameraControl.zip

  release:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ElgatoCameraControl
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Полное приложение для Apple Silicon и Intel, со встроенным опциональным HomeKit-мостом.

          **Установка:** скачайте ZIP, распакуйте, перетащите приложение в «Программы» и запустите. Python и консоль не нужны.

          **Apple Home:** в меню приложения включите «Подключать лампы к Apple Home». На новой установке опция выключена. Если лампу уже публикует Homebridge, включать её не нужно.
          EOF
          gh release delete app-latest --cleanup-tag --yes || true
          gh release create app-latest ElgatoCameraControl.zip --target "$GITHUB_SHA" \
            --title "Elgato Camera Control.app" \
            --notes-file release-notes.md
